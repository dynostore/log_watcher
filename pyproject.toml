[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynostore-logwatcher"
dynamic = ["version"]  # 1. Explicitly declare the version as dynamic
authors = [
    { name = "Dante D. Sanchez-Gallegos", email = "dantsanc@pa.uc3m.es" },
    { name = "Gabriele Morabito", email = "gabriele.morabito@unime.it" }
]
description = "DynoStore log watcher client library"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}
dependencies = [
    "watchdog==6.0.0",
    "requests==2.32.5",
    "python-dotenv" # Note: the PyPI package name is 'python-dotenv', not 'dotenv'
]

[project.scripts]
logwatcher = "logwatcher.log_watcher:main"

[project.urls]
Homepage = "https://github.com/dynostore/log_watcher"
Issues = "https://github.com/dynostore/log_watcher/issues"

[tool.setuptools.dynamic]
# 2. Point to the actual module name where the variable lives
version = {attr = "logwatcher.__version__"} 

[tool.setuptools.packages.find]
where = ["."]